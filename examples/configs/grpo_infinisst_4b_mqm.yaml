# GRPO Algorithm Configuration
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_rollout_turns: 60 # Maximum turns allowed per rollout
  max_num_steps: 10000
  reduce_baseline_rewards: false
  normalize_rewards: false
  use_leave_one_out_baseline: false
  val_period: 10
  val_at_start: true
  max_val_samples: 512
  val_batch_size: 512

loss_fn:
  reference_policy_kl_penalty: 0.01
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  token_level_loss: true

policy:
  model_name: "/ckpts/infinisst/yodas_5kh_v2_m12_stage2_4b_8k_4e-5_4node/checkpoints/step=2000-last.ckpt.hf"
  # model_name: "/ckpts/llm/qwen2.5-0.5b-instruct"
  tokenizer:
    name: ${policy.model_name} ## specify if you'd like to use a tokenizer different from the model's default
  train_global_batch_size: 128
  train_micro_batch_size: 1
  generation_batch_size: 32 # Only used when generating using HF backend
  logprob_batch_size: 4
  max_total_sequence_length: 4096
  precision: "bfloat16"
  fsdp_offload_enabled: false
  activation_checkpointing_enabled: false

  dtensor_cfg:
    enabled: true
    cpu_offload: False
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  dynamic_batching:
    enabled: True
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1e-6
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8
      # when using Dtensor, we need to set foreach
      # and fused to False
      foreach: False
      fused: False

  scheduler:
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: []

  generation:
    backend: "vllm"
    max_new_tokens: 40
    temperature: 1.0
    top_p: 0.999
    top_k: 10000
    max_token_id: 151645
    stop_token_ids: null
    stop_strings: null
    audio_token_id: 151656
    bad_words: ["\n"]
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}
    vllm_kwargs:
      enable_prompt_embeds: false
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

data:
  train_data_file: "/data/asr/yodas/npy_4b_opt/parakeet-tdt-0.6b-v2_robust60-1120_langid_zh_blaser2.0-qe3.0_metricx-qe4.0_simalign/en000/manifest.parquet"
  val_data_file: "/data/asr/yodas/npy_4b_opt/parakeet-tdt-0.6b-v2_robust60-1120_langid_zh_blaser2.0-qe3.0_metricx-qe4.0_simalign/en_dev/manifest.parquet"
  train_data_shuffle: true
  val_data_shuffle: false
  seed: 42
  src_lang: "en"
  tgt_lang: "zh"
 
env:
  infinisst:
    cfg:
      max_turns: ${grpo.max_rollout_turns}
      model_name: ${policy.model_name}
      scoring_model_type: "mqm"
      scoring_examples_path: "/code/RL/nemo_rl/environments/games/mqm/gemba_examples.jsonl"
      scoring_model_path: "/ckpts/llm/qwen3-30b-a3b-instruct-2507-fp8"
      scoring_model_samples: 8
      qe: false
      batch_size: 32
      src_lang: ${data.src_lang}
      tgt_lang: ${data.tgt_lang}
      step_size: 1.12
      alpha: 1.0
      beta: 0.0
      max_latency: 10.0
      normalize: true
      num_gpus: 8

cluster:
  gpus_per_node: 8
  num_nodes: 2

checkpointing:
  enabled: true
  checkpoint_dir: "/ckpts/infinisst-rl/grpo-4b-mqm"
  metric_name: "val_mqm"
  higher_is_better: true
  keep_top_k: 3
  save_period: 10

logger:
  log_dir: "logs"  # Base directory for all logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: true
  tensorboard_enabled: false
  monitor_gpus: true  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  wandb:
    project: "infinisst-rl"
    name: grpo-4b-mqm
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)
