# GRPO Algorithm Configuration
defaults: "grpo_infinisst_interactive.yaml"

grpo:
  num_prompts_per_step: 8
  max_rollout_turns: 60 # Maximum turns allowed per rollout
  val_at_start: false
  max_val_samples: 128
  val_batch_size: 128
  normalize_rewards: false
  reduce_baseline_rewards: false

policy:
  model_name: "/ckpts/infinisst/yodas_5kh_v2_m12_stage2_7b_1node/checkpoints/step=2000-last.ckpt.hf"
  train_global_batch_size: 128

  generation:
    vllm_kwargs:
      enable_prompt_embeds: false
 
env:
  infinisst:
    cfg:
      # scoring_model_type: "google/metricx-24-hybrid-large-v2p6-bfloat16"
      # scoring_model_path: "/ckpts/llm/metricx-24-hybrid-large-v2p6-bfloat16"
      # scoring_tokenizer_path: "/ckpts/llm/mt5-xl"
      scoring_model_type: "Unbabel/XCOMET-XL"
      scoring_model_path: "/ckpts/llm/xcomet-xl"
      qe: true
      gamma: 10.0
      normalize: true
      max_latency: 10.0
      num_gpus: 4
      
logger:
  wandb_enabled: false

cluster:
  gpus_per_node: 4
  num_nodes: 1
