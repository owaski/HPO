# GRPO Algorithm Configuration
defaults: "grpo_infinisst_nr_vllm.yaml"

grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 16
  max_rollout_turns: 60 # Maximum turns allowed per rollout
  max_num_steps: 10000

policy:
  train_global_batch_size: 1024

checkpointing:
  checkpoint_dir: "results/grpo-infinisst-lcme-nr-vllm-bsz64"

logger:
  wandb:
    project: "grpo-dev"
    name: "infinisst-lcme-nr-vllm-bsz64"